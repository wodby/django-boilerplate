version: 0.1

jobs:
  django-system-check:
    steps:
    - run: python manage.py check
    - run: |
        curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 \
          --retry-connrefused \
          "http://${WODBY_APP_SERVICE_NAME}:8080/healthz"
    - run: |
        if [ -z "${CELERY_BROKER_URL:-}" ]; then
          echo "CELERY_BROKER_URL is not configured; skipping Celery worker check"
          exit 0
        fi
        # A worker that started with this deployment may need a while to connect to the broker; wait up to about
        # two minutes for it to answer.
        for attempt in $(seq 1 12); do
          celery status --timeout=5 && exit 0
          sleep 5
        done
        exit 1
