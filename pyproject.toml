[project]
name = "django-boilerplate"
version = "0.1.0"
description = "Minimal Django application for Wodby"
requires-python = ">=3.10"
dependencies = [
    "celery[redis]>=5.6,<6",
    "dj-database-url>=3.1,<4",
    "django>=5.2.8,<6",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
